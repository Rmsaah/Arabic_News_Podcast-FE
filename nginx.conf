# Sets the number of worker processes (usually 1 per core is fine for simple serving)
worker_processes  auto;

events {
    # Sets the maximum number of simultaneous connections that can be opened by a worker process
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Speed up transfer rates
    sendfile        on;

    # Enable Gzip compression (good for Angular assets)
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        # NGINX listens on port 80 (as exposed in your Dockerfile)
        listen 80;

        # Define the main location block for serving the Angular app
        location / {
            # Root points to where your compiled Angular files were copied in Stage 2
            root   /usr/share/nginx/html;
            index  index.html;

            # --- THE CRITICAL LINE FOR SPAs ---
            # 1. Tries to serve the requested file ($uri)
            # 2. If not found, it tries a directory ($uri/)
            # 3. If still not found (deep link), it sends the main index.html file
            # This allows the Angular router to take over and handle the route.
            try_files $uri $uri/ /index.html;
        }

        # Optional: Prevents browsers from caching the index.html
        # This is useful to ensure users always get the latest version after deployment.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
