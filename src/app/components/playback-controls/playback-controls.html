@if (currentPodcast() && currentPodcast()!.audioUrlPath) {
  <!-- HTML5 Audio Element (hidden) -->
  <audio
    #audioPlayer
    [src]="currentPodcast()!.audioUrlPath"
    (timeupdate)="onTimeUpdate()"
    (ended)="onAudioEnded()"
    (loadedmetadata)="onAudioLoaded()"
    (error)="onAudioError($event)"
    preload="metadata">
  </audio>

  <!-- Playback Controls - Fixed to viewport bottom -->
  <div class="playback-controls-wrapper" [class.expanded]="isExpanded()">

    <!-- Backdrop Overlay (only visible when expanded) -->
    @if (isExpanded()) {
      <div class="backdrop" (click)="collapsePlayer()"></div>
    }

    <!-- Main Player Container -->
    <div class="playback-controls-container">

      <!-- Mini Player (Spotify-style RTL layout) -->
      @if (!isExpanded()) {
        <div class="mini-player" dir="auto">
          <div class="mini-player-content">

            <!-- RIGHT SECTION: Episode Info + Cover (Arabic first) -->
            <div class="episode-info-section">
              @if (currentPodcast()!.imageUrl) {
                <img
                  [src]="currentPodcast()!.imageUrl"
                  alt="Episode cover"
                  class="player-cover"
                  (click)="toggleExpand()">
              }
              <div class="episode-details" (click)="toggleExpand()">
                <h6 class="episode-title-mini">{{ currentPodcast()!.title }}</h6>
                <small class="episode-subtitle-mini">{{ currentPodcast()!.articleAuthor }}</small>
              </div>
            </div>

            <!-- MIDDLE SECTION: Playback Controls -->
            <div class="controls-section">
              <!-- Control Buttons Row -->
              <div class="controls-buttons-row">
                <button
                  class="btn-control btn-control-secondary"
                  (click)="seek(-10)"
                  title="رجوع 10 ثانية">
                  <i class="bi bi-skip-backward-fill"></i>
                </button>

                <button
                  class="btn-control btn-control-play"
                  (click)="togglePlayPause()"
                  [title]="isPlaying() ? 'إيقاف مؤقت' : 'تشغيل'">
                  <i [class]="isPlaying() ? 'bi bi-pause-fill' : 'bi bi-play-fill'"></i>
                </button>

                <button
                  class="btn-control btn-control-secondary"
                  (click)="seek(10)"
                  title="تقديم 10 ثانية">
                  <i class="bi bi-skip-forward-fill"></i>
                </button>
              </div>

              <!-- Progress Bar Row -->
              <div class="progress-section">
                <span class="time-display">{{ formattedPosition() }}</span>
                <div class="progress-bar-container" (click)="seekToPosition($event)">
                  <div class="progress-bar-bg">
                    <div
                      class="progress-bar-fill"
                      [style.width.%]="(currentPosition() / currentPodcast()!.durationSeconds) * 100">
                    </div>
                  </div>
                </div>
                <span class="time-display">{{ formattedDuration() }}</span>
              </div>
            </div>

            <!-- LEFT SECTION: Helper Tools -->
            <div class="tools-section">
              <!-- Expand Button -->
              <button
                class="btn-tool"
                (click)="toggleExpand()"
                title="توسيع المشغل">
                <i class="bi bi-chevron-up"></i>
              </button>

              <!-- Stop/Close Button -->
              <button
                class="btn-tool btn-tool-danger"
                (click)="close()"
                title="إيقاف وإغلاق">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>

          </div>
        </div>
      }

      <!-- Expanded Player (Full-screen overlay) -->
      @if (isExpanded()) {
        <app-expanded-player
          [episode]="currentPodcast()!"
          [currentPosition]="currentPosition()"
          [formattedPosition]="formattedPosition()"
          [formattedDuration]="formattedDuration()"
          [isPlaying]="isPlaying()"
          (collapse)="collapsePlayer()"
          (close)="close()"
          (togglePlayPause)="togglePlayPause()"
          (seek)="seek($event)"
          (seekToPosition)="seekToPosition($event)"
          (setPlaybackRate)="setPlaybackRate($event)">
        </app-expanded-player>
      }

    </div>
  </div>
}

<!-- Rating Screen Component -->
<app-rating-screen
  [episode]="currentPodcast()"
  [visible]="showRatingScreen()"
  (close)="onRatingScreenClose()"
  (playEpisode)="onPlayRelatedEpisode($event)">
</app-rating-screen>
