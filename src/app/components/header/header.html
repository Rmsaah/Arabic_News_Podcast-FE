<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="!isMenuCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <!-- Left side: User UI (Profile/Login/Logout) -->
      <ul class="navbar-nav me-auto">
        @if (isAuthenticated()) {
          <li class="nav-item">
          <a class="nav-link" routerLink="/profile" routerLinkActive="active">
            <i class="bi bi-person-circle me-1"></i>
            {{ currentUser()?.username || 'ملفي الشخصي' }}
          </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="logout()" style="cursor: pointer;">
              تسجيل الخروج
              <i class="bi bi-box-arrow-right me-1"></i>
            </a>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" (click)="openLoginModal()" style="cursor: pointer;">
              تسجيل الدخول
              <i class="bi bi-box-arrow-in-right me-1"></i>
            </a>
          </li>
        }
      </ul>

      <!-- Right side: Navigation links (Search/Episodes/Home) -->
      <ul class="navbar-nav ms-auto">
        <!-- Compact Search -->
        <li class="nav-item">
          <div class="header-search-wrapper">
            <button
              class="nav-link search-toggle"
              (click)="toggleSearch()"
              [class.active]="isSearchOpen">
              <i class="bi bi-search"></i>
            </button>
            <div class="header-search-input" [class.open]="isSearchOpen">
              <input
                type="text"
                class="form-control form-control-sm"
                placeholder="بحث..."
                [(ngModel)]="searchQuery"
                (keyup.enter)="onSearch()">
              <button
                class="btn btn-sm btn-light"
                (click)="onSearch()"
                [disabled]="!searchQuery.trim()">
                <i class="bi bi-arrow-left"></i>
              </button>
            </div>
          </div>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/episodes" routerLinkActive="active">
            الحلقات
            <i class="bi bi-collection-play me-1"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            الرئيسية
            <i class="bi bi-house-door me-1"></i>
          </a>
        </li>
      </ul>
    </div>
    <a class="navbar-brand" routerLink="/">
      سعودي بود
      <i class="bi bi-broadcast me-2"></i>
    </a>
  </div>
</nav>
